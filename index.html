<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wer forscht mit wem in Wien? Ein Netz in 3D</title>
  <meta name="description" content="Für eine Ausstellung über Wissenschaft: Wiens Forschungsorte, ihre gemeinsamen Veröffentlichungen und alle ihre Standorte im 3D-Stadtmodell.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23000'/%3E%3Cpath d='M9 22 22 10' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='9' cy='22' r='5' fill='%23e6ff68'/%3E%3Ccircle cx='22' cy='10' r='4' fill='%23740b85'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&display=swap">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-grotesk@400,500,600&display=swap">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="pins"></div>
  <div id="eggs"></div>

  <header class="top">
    <div class="title">
      <img class="mark" src="q-logo.svg" alt="Q" width="50" height="56">
      <div>
        <h1 data-t="title"></h1>
        <p id="subtitle"></p>
      </div>
    </div>
    <div class="controls">
      <div class="seg" role="group" data-t-label="viewLabel">
        <button type="button" id="viewNet" data-t="viewNet" aria-pressed="true"></button>
        <button type="button" id="viewCity" data-t="viewCity" aria-pressed="false"></button>
      </div>
      <button type="button" class="btn" id="lang"></button>
      <button type="button" class="btn icon" id="pause" aria-pressed="false"></button>
      <button type="button" class="btn icon" id="menuBtn" popovertarget="menu" data-t-label="menu"><span aria-hidden="true">☰</span></button>
    </div>
    <nav class="crumbs" id="crumbs" hidden data-t-label="crumbsLabel"></nav>
  </header>

  <main>
  <aside class="panel" id="panel" hidden aria-live="polite" tabindex="-1"></aside>

  <section class="legend" id="legend" data-t-label="legendLabel">
    <ul id="legendTopics"></ul>
    <button type="button" id="legendMore" aria-expanded="false" aria-controls="legendTopics" data-t="keyColours"></button>
    <p><span class="key-ball"></span><span data-t="keyBall"></span></p>
    <p><span class="key-line"></span><span data-t="keyLine"></span></p>
    <p id="keySite" hidden><span class="key-site"></span><span data-t="keySite"></span></p>
    <p class="found" id="foundCount" hidden></p>
  </section>

  <div class="band" aria-hidden="true"><div class="band-track" id="bandTrack"></div></div>

  <div class="dock" id="dock">
    <button type="button" class="btn primary" id="tourStart" data-t-label="tourStart"><span class="long" data-t="tourStart"></span><span class="short" data-t="tourShort"></span></button>
    <button type="button" class="btn" id="listOpen" data-t-label="listOpen"><span class="long" data-t="listOpen"></span><span class="short" data-t="listShort"></span></button>
    <button type="button" class="btn" id="aboutOpen" data-t-label="aboutOpen"><span class="long" data-t="aboutOpen"></span><span class="short" data-t="aboutShort"></span></button>
    <button type="button" class="btn" id="homeBtn" data-t-label="home"><span aria-hidden="true">⌂</span><span class="long" data-t="home"></span></button>
  </div>
  <button type="button" class="hint" id="hint"><span data-t="hint"></span><b><span data-t="tourShort"></span> ›</b></button>

  <nav class="tabs" data-t-label="viewLabel">
    <button type="button" id="tabNet" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 16.5 16.5 7M8 17.5l8.5 1" /><circle cx="6" cy="17.5" r="3"/><circle cx="17.5" cy="6" r="2.5"/><circle cx="18.5" cy="18.5" r="2"/></svg><span data-t="viewNet"></span></button>
    <button type="button" id="tabCity" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21V10l6-3v14M9 21V4l6 3v14M15 21v-9l6 2v7M2 21h20"/></svg><span data-t="viewCity"></span></button>
    <button type="button" id="tabList" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1.4"/><circle cx="4" cy="12" r="1.4"/><circle cx="4" cy="18" r="1.4"/></svg><span data-t="listShort"></span></button>
  </nav>

  <div class="menu on-light" id="menu" popover>
    <button type="button" data-do="tourStart" data-t="tourStart"></button>
    <button type="button" data-do="aboutOpen" data-t="aboutOpen"></button>
    <button type="button" data-do="pause" id="menuPause"></button>
    <p id="menuFound" hidden></p>
  </div>

  <section class="tour on-light" id="tour" hidden aria-live="polite">
    <p><span class="tag" id="tourCount"></span></p>
    <h2 id="tourTitle"></h2>
    <div id="tourBody"></div>
    <div class="tour-nav">
      <button type="button" class="btn" id="tourBack" data-t="back"></button>
      <button type="button" class="btn primary" id="tourNext"></button>
      <button type="button" class="btn quiet" id="tourClose" data-t="tourClose"></button>
    </div>
  </section>

  </main>

  <div class="toast" id="toast" popover="manual" role="status"></div>

  <dialog id="egg" class="on-light egg-card">
    <div id="eggBody"></div>
    <form method="dialog"><button class="btn primary" data-t="close"></button></form>
  </dialog>

  <dialog id="about" class="on-light">
    <div id="aboutBody"></div>
    <form method="dialog"><button class="btn primary" data-t="close"></button></form>
  </dialog>

  <p class="fallback" id="fallback" hidden></p>
  <script type="module" src="app.js"></script>
</body>
</html>
